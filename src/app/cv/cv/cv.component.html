<div class="row">
  <div class="col">
    <div class="alert alert-warning">
      {{ date | date : "full" | uppercase }}
    </div>
    <app-list [cvs]="(cvs$ | async) ?? []"></app-list>
  </div>
  <div class="col">
    <app-cv-card [cv]="selectedCv$ | async"></app-cv-card>
  </div>
</div>

@defer (on viewport; prefetch on idle) {
  <app-embauche></app-embauche>
} @placeholder (minimum 300ms) {
  <div class="card mt-3 border-dashed text-center p-3 text-muted bg-light">
    <small><i class="fa fa-info-circle me-1"></i> Section Embauche (défilez pour afficher)</small>
  </div>
} @loading (minimum 300ms; after 100ms) {
  <div class="d-flex justify-content-center align-items-center p-3 mt-3">
    <div class="spinner-border text-primary spinner-border-sm me-2" role="status"></div>
    <span class="text-primary font-monospace">Chargement différé du composant Embauche...</span>
  </div>
} @error {
  <div class="alert alert-danger mt-3" role="alert">
    <i class="fa fa-exclamation-triangle me-2"></i> Échec du chargement du composant Embauche.
  </div>
}
