@if (vm$ | async; as vm) {

  <div class="alert alert-warning">
    Product Number: {{ vm.products.length }} / {{ vm.total }}
  </div>

  @if (vm.products.length) {
    <div class="row">
      @for (product of vm.products; track product.id) {
        <div class="col-4">
          <img
            class="rounded-circle"
            [src]="product.thumbnail"
            [alt]="product.title"
            width="150"
            height="150"
            loading="lazy"
            decoding="async"
          />
          {{ product.title }}
        </div>
      }
    </div>
  } @else {
    Loading...
  }

  <button
    class="btn btn-primary"
    type="button"
    [disabled]="!vm.hasMore"
    (click)="loadMore()"
  >
    More Products
  </button>
  
} @else {
  Loading...
}
